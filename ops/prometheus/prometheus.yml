# Local Prometheus for `docker compose --profile app --profile observability up`.
# The backend serves /actuator/prometheus only to the configured scraper (HTTP Basic).
# Set ATLAS_METRICS_USERNAME=prometheus and ATLAS_METRICS_PASSWORD in .env, and put the
# same password in ops/prometheus/metrics-password (git-ignored).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: atlas-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/metrics-password
    static_configs:
      - targets: ["backend:8080"]
