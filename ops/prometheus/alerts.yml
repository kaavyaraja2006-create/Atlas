groups:
  - name: atlas
    rules:
      # NFR-PERF-1 as a standing alert: p95 of paginated reads over 300 ms.
      - alert: AtlasReadLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{method="GET", uri=~"/api/v1/.*", status=~"2.."}[5m]))) > 0.3
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 of successful API reads is above 300 ms (NFR-PERF-1)"
      - alert: AtlasServerErrors
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1e-9) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "More than 1 % of requests fail with 5xx"
      # Any verification result other than INTACT / NO_ANCHORS means the audit history needs a person.
      - alert: AtlasAuditAnchorMismatch
        expr: sum(increase(atlas_audit_anchor_verifications_total{status!~"INTACT|NO_ANCHORS"}[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "Audit chain does not match its signed external anchors"
      - alert: AtlasAuditAnchoringFailing
        expr: sum(increase(atlas_audit_anchors_total{result="failed"}[30m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "Anchors could not be written; the unprotected window is growing"
      - alert: AtlasSignInAbuse
        expr: sum(rate(atlas_ratelimit_rejected_total{limit="sign-in"}[5m])) * 60 > 30
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Sign-in rate limit rejecting more than 30 requests a minute"
      - alert: AtlasRecoveryStepsFailing
        expr: sum(increase(atlas_recovery_steps_total{status=~"FAILED|BLOCKED"}[1h])) > 0
        labels: {severity: warning}
        annotations:
          summary: "A recovery execution had failed or blocked steps"
