# promtool test rules ops/prometheus/alerts.test.yml   (synthetic series, not real traffic)
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - name: an anchor mismatch alerts at once; INTACT and NO_ANCHORS never do
    interval: 1m
    input_series:
      - series: 'atlas_audit_anchor_verifications_total{status="INTACT"}'
        values: '0+5x30'
      - series: 'atlas_audit_anchor_verifications_total{status="NO_ANCHORS"}'
        values: '0+1x30'
      - series: 'atlas_audit_anchor_verifications_total{status="REWRITTEN"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: AtlasAuditAnchorMismatch
        exp_alerts: []
      - eval_time: 12m
        alertname: AtlasAuditAnchorMismatch
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: "Audit chain does not match its signed external anchors"}

  - name: p95 over 300 ms for 10 minutes alerts; fast reads do not
    interval: 1m
    input_series:
      # 100 reads a minute; 90 % under 100 ms, 10 % between 300 ms and 1 s: p95 lands above 300 ms
      - series: 'http_server_requests_seconds_bucket{method="GET",uri="/api/v1/orders",status="200",le="0.1"}'
        values: '0+90x30'
      - series: 'http_server_requests_seconds_bucket{method="GET",uri="/api/v1/orders",status="200",le="0.3"}'
        values: '0+90x30'
      - series: 'http_server_requests_seconds_bucket{method="GET",uri="/api/v1/orders",status="200",le="1.0"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_bucket{method="GET",uri="/api/v1/orders",status="200",le="+Inf"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: AtlasReadLatencyHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: AtlasReadLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "p95 of successful API reads is above 300 ms (NFR-PERF-1)"}

  - name: fast reads never alert
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{method="GET",uri="/api/v1/orders",status="200",le="0.1"}'
        values: '0+99x30'
      - series: 'http_server_requests_seconds_bucket{method="GET",uri="/api/v1/orders",status="200",le="+Inf"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AtlasReadLatencyHigh
        exp_alerts: []

  - name: 5xx above 1 % alerts
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{status="200"}'
        values: '0+97x20'
      - series: 'http_server_requests_seconds_count{status="500"}'
        values: '0+3x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: AtlasServerErrors
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: "More than 1 % of requests fail with 5xx"}
