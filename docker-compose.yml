# Local stack.
#   cp .env.example .env              # then set real local passwords
#   docker compose up -d postgres     # database only (backend run from the IDE)
#   docker compose --profile app up   # database + backend + web tier on http://localhost:8088
#   docker compose --profile app --profile observability up   # + Prometheus and Grafana
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: ${ATLAS_DB_USER:?set ATLAS_DB_USER in .env}
      POSTGRES_PASSWORD: ${ATLAS_DB_PASSWORD:?set ATLAS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"   # local only: the database is never exposed to the network
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    profiles: ["app"]          # docker compose --profile app up
    environment:
      ATLAS_DB_URL: jdbc:postgresql://postgres:5432/atlas
      ATLAS_DB_USER: ${ATLAS_DB_USER}
      ATLAS_DB_PASSWORD: ${ATLAS_DB_PASSWORD}
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:?set ATLAS_JWT_SECRET in .env}
      ATLAS_COOKIE_SECURE: ${ATLAS_COOKIE_SECURE:-true}
      # Behind the web tier, which passes one clean client address (see frontend/deploy/Caddyfile).
      ATLAS_FORWARD_HEADERS: framework
      ATLAS_RATELIMIT_APIPERMINUTE: ${ATLAS_RATELIMIT_APIPERMINUTE:-600}
      ATLAS_RATELIMIT_REGISTRATIONSPERHOUR: ${ATLAS_RATELIMIT_REGISTRATIONSPERHOUR:-5}
      ATLAS_METRICS_USERNAME: ${ATLAS_METRICS_USERNAME:-}
      ATLAS_METRICS_PASSWORD: ${ATLAS_METRICS_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"   # direct API access for local tools only
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    profiles: ["app"]
    environment:
      ATLAS_API_UPSTREAM: backend:8080
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=:9090"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/prometheus/metrics-password:/etc/prometheus/metrics-password:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    # Compose interpolates every service, even with its profile off, so no ":?" here; the
    # entrypoint refuses to start Grafana without a password instead.
    entrypoint: ["/bin/sh", "-c", 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "set GRAFANA_ADMIN_PASSWORD in .env" >&2; exit 1; }; exec /run.sh']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  atlas-pgdata:
