name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema guarantees (psql)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: atlas
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      # psql and pgbench: GitHub's Ubuntu images ship PostgreSQL binaries
      # (server stopped); install them only if missing. pgbench lives in the
      # server package, not postgresql-client.
      - name: Put psql and pgbench on PATH
        run: |
          if ! ls /usr/lib/postgresql/*/bin/pgbench >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" >> "$GITHUB_PATH"
      - name: Migrations apply and schema assertions pass
        run: scripts/verify-schema.sh
      - name: Audit chain stays intact under concurrent writers
        run: scripts/chain-concurrency-check.sh 16 200
      - name: Repository SQL (extracted from Java source) behaves correctly
        run: python3 -I scripts/verify-repository-sql.py
      - name: Every endpoint checks a permission or is an approved exception
        run: python3 -I scripts/check-authorization.py
      - name: The committed permission table matches the source
        run: |
          python3 -I scripts/check-authorization.py --markdown "$RUNNER_TEMP/endpoint-permissions.md" >/dev/null
          diff -u docs/security/endpoint-permissions.md "$RUNNER_TEMP/endpoint-permissions.md"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Audit anchoring catches a superuser rewrite (real signer, file log, SQL)
        run: scripts/anchor-end-to-end.sh

  backend:
    name: Backend build, unit + integration tests, coverage gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the runner's Docker daemon for PostgreSQL 16. JaCoCo fails the
      # build below 80 % line coverage in recovery, audit and provenance (NFR-QA-1).
      - name: mvn verify
        run: mvn -B verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco

  frontend:
    name: Frontend typecheck, tests, build, CSP, accessibility, web tier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The production build must run under the strict Content-Security-Policy.
      - run: npm run csp-check
      # axe-core (WCAG 2.1 A/AA) on 20 rendered states + a keyboard-only sign-in (NFR-A11Y-1).
      - run: npm run a11y
      - name: Web tier (the production Caddyfile) routes, headers, CSP and client address
        working-directory: .
        run: |
          scripts/ci/fetch-tool.sh caddy "$RUNNER_TEMP/bin"
          CADDY="$RUNNER_TEMP/bin/caddy" scripts/web-tier-check.sh
      - name: Upload screenshots and accessibility results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-screenshots
          path: frontend/e2e/out

  config:
    name: Workflows, Dockerfiles, observability config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified tools
        run: for t in actionlint hadolint promtool; do scripts/ci/fetch-tool.sh "$t" "$RUNNER_TEMP/bin"; done
      - name: actionlint
        run: |
          "$RUNNER_TEMP/bin/actionlint"
      - name: hadolint
        run: |
          "$RUNNER_TEMP/bin/hadolint" backend/Dockerfile frontend/Dockerfile
      - name: Prometheus config, alert rules + their unit tests, dashboard queries
        run: PROMTOOL="$RUNNER_TEMP/bin/promtool" scripts/check-observability.sh
      # OpenTofu: the same binary and AWS provider (6.70.x) the configuration was validated with.
      - name: Infrastructure (infra/terraform) format and validate
        working-directory: infra/terraform
        run: |
          "$GITHUB_WORKSPACE/scripts/ci/fetch-tool.sh" tofu "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/tofu" fmt -check -recursive
          "$RUNNER_TEMP/bin/tofu" init -backend=false -input=false
          "$RUNNER_TEMP/bin/tofu" validate
      - name: Checkov (infrastructure security; skips are inline, each with its reason)
        run: |
          python3 -m pip install --quiet "checkov==3.3.29"
          checkov -d infra/terraform --framework terraform --quiet --compact

  security:
    name: Secrets and dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just the last commit
      - name: gitleaks (history + working tree)
        run: |
          scripts/ci/fetch-tool.sh gitleaks "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/gitleaks" git . --redact --no-banner
          "$RUNNER_TEMP/bin/gitleaks" dir . --redact --no-banner
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (production and dev dependencies)
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Trivy on the Maven and npm manifests (HIGH/CRITICAL with a fix)
        run: |
          scripts/ci/fetch-tool.sh trivy "$RUNNER_TEMP/bin"
          for manifest in backend/pom.xml frontend/package-lock.json; do
            "$RUNNER_TEMP/bin/trivy" fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$manifest"
          done

  # The whole product, built as images and run as it would be deployed: web tier -> API
  # -> PostgreSQL. Seeds the labelled demo data through the API, recovers the planted
  # mistake end to end, then measures and scans the running stack.
  stack:
    name: Running stack - demo, recovery, k6, ZAP, image scan
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: app
      WEB: http://127.0.0.1:8088
    steps:
      - uses: actions/checkout@v4
      - name: CI-only secrets (generated per run, never stored)
        run: |
          {
            echo "ATLAS_DB_USER=atlas"
            echo "ATLAS_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "ATLAS_JWT_SECRET=$(openssl rand -base64 48)"
            echo "ATLAS_COOKIE_SECURE=false"
            # 50 virtual users share one account in the load test (see scripts/load).
            echo "ATLAS_RATELIMIT_APIPERMINUTE=100000"
          } > .env
      - name: Build images
        run: docker compose build
      - name: Fetch verified tools
        run: for t in trivy k6; do scripts/ci/fetch-tool.sh "$t" "$RUNNER_TEMP/bin"; done
      - name: Scan images (HIGH/CRITICAL with a fix fails)
        run: |
          for image in $(docker compose config --images | grep -v postgres); do
            "$RUNNER_TEMP/bin/trivy" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Start the stack
        run: |
          docker compose up -d
          for _ in $(seq 90); do curl -sf "$WEB/healthz" >/dev/null && exit 0; sleep 2; done
          docker compose logs backend | tail -100; exit 1
      - name: Seed labelled synthetic demo data through the API
        run: |
          python3 -I scripts/seed-demo.py --api "$WEB" --yes-this-is-a-demo-environment \
            --summary-out "$RUNNER_TEMP/demo-summary.json" --credentials-out "$RUNNER_TEMP/demo-credentials.txt"
      - name: Recover the planted mistake end to end (incident, plan, approval, execution, verification)
        run: |
          python3 -I scripts/demo-recovery-smoke.py --api "$WEB" \
            --summary "$RUNNER_TEMP/demo-summary.json" --credentials "$RUNNER_TEMP/demo-credentials.txt"
      - name: k6 - NFR-PERF-1 (p95 < 300 ms, 50 users), through the web tier
        run: |
          read -r _ email password < <(grep '^auditor ' "$RUNNER_TEMP/demo-credentials.txt")
          org=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['organization']['id'])" "$RUNNER_TEMP/demo-summary.json")
          "$RUNNER_TEMP/bin/k6" run -e BASE_URL="$WEB" -e EMAIL="$email" -e PASSWORD="$password" -e ORG_ID="$org" \
            -e DURATION=3m --summary-export "$RUNNER_TEMP/k6-summary.json" scripts/load/paginated-reads.js
      - name: ZAP baseline (passive scan; any FAIL-level finding fails the job)
        run: |
          mkdir -p "$RUNNER_TEMP/zap" && chmod 777 "$RUNNER_TEMP/zap"
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t "$WEB" -I -r zap-report.html -J zap-report.json
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color | tail -300
      - name: Upload k6, ZAP and demo summary (no credentials)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stack-results
          path: |
            ${{ runner.temp }}/k6-summary.json
            ${{ runner.temp }}/zap
            ${{ runner.temp }}/demo-summary.json
      - name: Stop
        if: always()
        run: docker compose down -v
